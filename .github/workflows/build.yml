name: Build ZegaAI APK

on: [push, workflow_dispatch]

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: android-actions/setup-android@v3

  - name: Install Android tools
    run: sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

  - name: Extract ZIP
    run: |
      ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
      test -n "$ZIP"
      mkdir project
      unzip -q "$ZIP" -d project
      ROOT=$(find project -name settings.gradle.kts -print -quit | xargs dirname)
      echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      gradle assembleDebug --no-daemon

  - uses: actions/upload-artifact@v4
    with:
      name: ZegaAI-APK
      path: project/**/app/build/outputs/apk/debug/app-debug.apk
